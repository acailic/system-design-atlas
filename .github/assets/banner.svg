<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">System Design Atlas</title>
  <desc id="d">Learn system design by reading the code that proved it — 40 canonical open-source codebases, walked file by file.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e7e2d4" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1280" height="400" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#fbfaf7"/>
    <rect width="1280" height="400" fill="url(#grid)"/>

    <!-- contour lines: the "atlas" -->
    <g fill="none" stroke="#e6d6b3" stroke-width="1.5">
      <path d="M690 400 C 760 300, 900 330, 960 250 S 1150 120, 1280 150"/>
      <path d="M740 400 C 810 320, 940 350, 1000 280 S 1170 160, 1280 190"/>
      <path d="M640 400 C 710 270, 860 300, 920 215 S 1120 70, 1280 105"/>
      <path d="M610 0 C 700 60, 820 40, 900 90 S 1100 60, 1280 30"/>
    </g>

    <!-- graph of systems -->
    <g stroke="#c9a46a" stroke-width="1.6" fill="none" opacity="0.9">
      <path d="M842 108 L 968 74 L 1106 112 L 1196 200 L 1102 292 L 960 318 L 846 254 Z"/>
      <path d="M842 108 L 960 196 L 1106 112"/>
      <path d="M960 196 L 1196 200"/>
      <path d="M960 196 L 960 318"/>
      <path d="M846 254 L 960 196 L 1102 292"/>
      <path d="M968 74 L 960 196"/>
    </g>
    <g fill="#fbfaf7" stroke="#8a5a00" stroke-width="2.4">
      <circle cx="842" cy="108" r="7"/>
      <circle cx="968" cy="74" r="7"/>
      <circle cx="1106" cy="112" r="7"/>
      <circle cx="1196" cy="200" r="7"/>
      <circle cx="1102" cy="292" r="7"/>
      <circle cx="960" cy="318" r="7"/>
      <circle cx="846" cy="254" r="7"/>
    </g>
    <circle cx="960" cy="196" r="13" fill="#8a5a00"/>
    <circle cx="960" cy="196" r="24" fill="none" stroke="#8a5a00" stroke-width="1.5" opacity="0.45"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#4c5566">
      <text x="800" y="94">redis</text>
      <text x="936" y="54">kafka</text>
      <text x="1120" y="102">postgresql</text>
      <text x="1166" y="236">linux</text>
      <text x="1116" y="322">llvm</text>
      <text x="934" y="352">kubernetes</text>
      <text x="784" y="288">sqlite</text>
    </g>
    <text x="940" y="204" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#8a5a00">your system</text>


    <!-- text block -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
      <text x="72" y="104" font-size="17" font-weight="600" letter-spacing="3.2" fill="#8a5a00">A CURATED ATLAS OF GREAT OPEN-SOURCE CODE</text>
    </g>
    <g font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" fill="#1f2430">
      <text x="70" y="182" font-size="74" font-weight="700">System Design Atlas</text>
    </g>
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#4c5566" font-size="25">
      <text x="72" y="236">Learn system design by reading the code that proved it.</text>
    </g>
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b4600">
      <rect x="72" y="276" width="168" height="38" rx="19" fill="#f0e2c8"/>
      <text x="156" y="301" text-anchor="middle" font-weight="600">40 deep-dives</text>
      <rect x="252" y="276" width="190" height="38" rx="19" fill="#f0e2c8"/>
      <text x="347" y="301" text-anchor="middle" font-weight="600">15 design patterns</text>
      <rect x="454" y="276" width="190" height="38" rx="19" fill="#f0e2c8"/>
      <text x="549" y="301" text-anchor="middle" font-weight="600">pinned to a commit</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="21.5" fill="none" stroke="#ddd8cb" stroke-width="1.5"/>
</svg>
